name: dB Studio LSQUIC Windows POC

on:
  workflow_dispatch:
  push:
    branches: ["poc/**"]
    paths:
      - ".github/workflows/quic-lsquic-poc.yml"
      - "docs/QUIC_LIBRARY_EVALUATION.md"
      - "poc/lsquic/**"

permissions:
  contents: read

concurrency:
  group: dB-Studio-LSQUIC-POC-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lsquic-windows-x64:
    name: Build and test pinned LSQUIC on Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout dB Studio
        uses: actions/checkout@v7

      - name: Set up Go for BoringSSL
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"

      - name: Install Perl
        shell: pwsh
        run: |
          choco install strawberryperl --yes --no-progress
          perl -v

      - name: Bootstrap pinned vcpkg and dependencies
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          git -C $vcpkgRoot checkout e54ef0fcc9a82033a61e51002552a910a5d57282
          & (Join-Path $vcpkgRoot "bootstrap-vcpkg.bat") -disableMetrics
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & (Join-Path $vcpkgRoot "vcpkg.exe") install zlib:x64-windows-static libevent:x64-windows-static pcre:x64-windows-static getopt:x64-windows

      - name: Verify vcpkg zlib artifacts
        shell: pwsh
        run: |
          $zlibInclude = Join-Path $env:VCPKG_ROOT "installed/x64-windows-static/include/zlib.h"
          $zlibDebug = Join-Path $env:VCPKG_ROOT "installed/x64-windows-static/debug/lib/zsd.lib"
          $zlibRelease = Join-Path $env:VCPKG_ROOT "installed/x64-windows-static/lib/zs.lib"
          if (!(Test-Path $zlibInclude) -or !(Test-Path $zlibDebug) -or !(Test-Path $zlibRelease)) {
            Get-ChildItem (Join-Path $env:VCPKG_ROOT "installed/x64-windows-static") -Recurse -Filter "*.lib" | Select-Object -ExpandProperty FullName
            throw "Expected zlib header and Debug/Release static libraries were not found"
          }

      - name: Fetch pinned LSQUIC and BoringSSL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force third_party | Out-Null
          git clone --branch v4.11.1 --depth 1 https://github.com/litespeedtech/lsquic.git third_party/lsquic
          git -C third_party/lsquic submodule update --init --recursive
          $lsquicHead = (git -C third_party/lsquic rev-parse HEAD).Trim()
          if ($lsquicHead -ne "2f4cd42f27cf8e9b0a0f43e376a618ec8ce4a7ff") { throw "Unexpected LSQUIC commit: $lsquicHead" }

          git clone --branch 0.20250807.0 --depth 1 https://boringssl.googlesource.com/boringssl third_party/boringssl
          $boringsslTag = (git -C third_party/boringssl describe --tags --exact-match).Trim()
          if ($boringsslTag -ne "0.20250807.0") { throw "Unexpected BoringSSL tag: $boringsslTag" }

      - name: Configure and build BoringSSL
        shell: pwsh
        run: |
          cmake -S third_party/boringssl -B build/boringssl -A x64 -DBUILD_SHARED_LIBS=OFF -DOPENSSL_NO_ASM=1
          cmake --build build/boringssl --config Debug --parallel 2

      - name: Prepare dB Studio IEM transport probe
        shell: pwsh
        run: |
          Copy-Item "poc/lsquic/iem_transport_probe.cpp" "third_party/lsquic/bin/iem_transport_probe.cpp"
          $probeCmake = @'
          add_executable(iem_transport_probe iem_transport_probe.cpp prog.c test_common.c test_cert.c)
          target_include_directories(iem_transport_probe PRIVATE "${CMAKE_SOURCE_DIR}/../../Source")
          set_property(TARGET iem_transport_probe PROPERTY CXX_STANDARD 17)
          set_property(TARGET iem_transport_probe PROPERTY CXX_STANDARD_REQUIRED ON)
          target_link_libraries(iem_transport_probe ${LIBS})
          '@
          Add-Content -Path "third_party/lsquic/bin/CMakeLists.txt" -Value $probeCmake

      - name: Configure LSQUIC with pinned dependencies
        shell: pwsh
        run: |
          # Keep upstream /W4 diagnostics visible, but do not promote newer MSVC enum warnings to build errors.
          $env:EXTRA_CFLAGS = "/WX-"
          cmake -S third_party/lsquic -B build/lsquic -A x64 `
            -DBUILD_SHARED_LIBS=OFF `
            -DLSQUIC_TESTS=ON `
            -DLSQUIC_BIN=ON `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Debug `
            -DCMAKE_EXE_LINKER_FLAGS="/DEFAULTLIB:bcrypt.lib" `
            -DGETOPT_INCLUDE_DIR="$env:VCPKG_ROOT/installed/x64-windows/include" `
            -DGETOPT_LIB="$env:VCPKG_ROOT/installed/x64-windows/lib/getopt.lib" `
            -DZLIB_INCLUDE_DIR="$env:VCPKG_ROOT/installed/x64-windows-static/include" `
            -DZLIB_LIB="$env:VCPKG_ROOT/installed/x64-windows-static/debug/lib/zsd.lib" `
            -DSSLLIB_INCLUDE="$PWD/third_party/boringssl/include" `
            -DLIBSSL_DIR="$PWD/build/boringssl"

      - name: Build LSQUIC and upstream test targets
        shell: pwsh
        run: |
          cmake --build build/lsquic --config Debug --target ALL_BUILD --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "LSQUIC ALL_BUILD failed with exit code $LASTEXITCODE" }
          $probeRuntime = "build/lsquic/bin/Debug"
          Get-ChildItem (Join-Path $env:VCPKG_ROOT "installed/x64-windows/bin") -Filter "*.dll" |
            Copy-Item -Destination $probeRuntime -Force
          cmake --build build/lsquic --config Debug --target RUN_TESTS --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "LSQUIC RUN_TESTS failed with exit code $LASTEXITCODE" }

      - name: Run QUIC TLS device authentication and IEM datagram probe
        shell: pwsh
        run: |
          $probe = Join-Path $PWD "build/lsquic/bin/Debug/iem_transport_probe.exe"
          if (!(Test-Path $probe)) { throw "IEM transport probe executable was not produced" }

          $serverCert = New-SelfSignedCertificate -DnsName "iem-poc.local" -CertStoreLocation "Cert:\CurrentUser\My" -KeyAlgorithm RSA -KeyLength 2048 -KeyExportPolicy Exportable -Type SSLServerAuthentication -NotAfter (Get-Date).AddDays(1)
          $rsa = [System.Security.Cryptography.X509Certificates.RSACertificateExtensions]::GetRSAPrivateKey($serverCert)
          $certPem = [System.Security.Cryptography.PemEncoding]::Write("CERTIFICATE", [byte[]]$serverCert.RawData)
          $keyPem = [System.Security.Cryptography.PemEncoding]::Write("PRIVATE KEY", [byte[]]$rsa.ExportPkcs8PrivateKey())
          $certPath = Join-Path $env:RUNNER_TEMP "iem-poc-cert.pem"
          $keyPath = Join-Path $env:RUNNER_TEMP "iem-poc-key.pem"
          [System.IO.File]::WriteAllText($certPath, [string]$certPem, [System.Text.UTF8Encoding]::new($false))
          [System.IO.File]::WriteAllText($keyPath, [string]$keyPem, [System.Text.UTF8Encoding]::new($false))
          $rsa.Dispose()

          function Start-IemProbeServer {
            $stdout = Join-Path $env:RUNNER_TEMP "iem-server-out.log"
            $stderr = Join-Path $env:RUNNER_TEMP "iem-server-err.log"
            $server = Start-Process -FilePath $probe -ArgumentList @("server", "127.0.0.1:24567", $certPath, $keyPath) -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            Start-Sleep -Seconds 2
            if ($server.HasExited) {
              Write-Host "IEM QUIC test server exit code: $($server.ExitCode)"
              Get-Content $stdout, $stderr
              throw "IEM QUIC test server exited before accepting a connection"
            }
            return $server
          }
          function Stop-IemProbeServer($server) {
            if ($server -and !$server.HasExited) { Stop-Process -Id $server.Id -Force }
            Start-Sleep -Milliseconds 500
          }

          $server = Start-IemProbeServer
          & $probe client "127.0.0.1:24567" $certPath "--bad-pin"
          $badPinExit = $LASTEXITCODE
          Stop-IemProbeServer $server
          if ($badPinExit -eq 0) { throw "A certificate with the wrong pin was accepted" }

          $server = Start-IemProbeServer
          & $probe client "127.0.0.1:24567" $certPath "--bad-token"
          $badTokenExit = $LASTEXITCODE
          Stop-IemProbeServer $server
          if ($badTokenExit -eq 0) { throw "An unpaired device was accepted" }

          $server = Start-IemProbeServer
          $probeOutput = & $probe client "127.0.0.1:24567" $certPath 2>&1
          $probeExit = $LASTEXITCODE
          $probeOutput | Write-Host
          Stop-IemProbeServer $server
          if ($probeExit -ne 0 -or ($probeOutput -join "`n") -notmatch "QUIC_TLS_DEVICE_AUTH_AND_AUDIO_DATAGRAM_OK") {
            throw "Authenticated QUIC audio datagram round trip failed"
          }
