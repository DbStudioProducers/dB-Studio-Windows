name: Android Receiver Bench

on:
  pull_request:
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-receiver-bench.yml"
  push:
    branches:
      - "feature/wifi-quic-poc-20261115"
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-receiver-bench.yml"

permissions:
  contents: read

jobs:
  android-debug-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble debug APK
        working-directory: mobile/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dbstudio-receiver-bench-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
