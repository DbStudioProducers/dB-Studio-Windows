name: dB Studio Native Windows Build

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  native-build:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure JUCE native application
        run: cmake -S . -B build -A x64

      - name: Compile native application
        run: cmake --build build --config Release --parallel 2

      - name: Upload native application
        uses: actions/upload-artifact@v4
        with:
          name: dB-Studio-0.5.0-Native-Windows
          path: build/dBStudio_artefacts/Release/
          if-no-files-found: error
          retention-days: 30

  legacy-virtual-lab:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: "x64"
      - name: Install legacy lab dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Python syntax check
        run: python -m py_compile run_desktop.py run_virtual_lab.py db_studio/ui_screens.py
      - name: Run legacy unit tests
        run: python -m unittest discover -s tests -v
      - name: Run virtual audio lab
        run: python run_virtual_lab.py --seconds 1.5 --rate 48000 --blocksize 128
