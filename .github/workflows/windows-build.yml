name: dB Studio Native Windows Build

concurrency:
  group: dB-Studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  native-build:
    # One hosted runner performs the full verification pipeline. Keeping
    # Python and native checks in one job avoids a second runner allocation
    # and prevents a pre-job failure in a prerequisite job from skipping the
    # actual Windows verification.
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: "x64"

      - name: Install virtual-lab dependencies
        run: python -m pip install -r requirements.txt

      - name: Check virtual-lab Python syntax
        run: python -m py_compile run_virtual_lab.py db_studio/mixer.py db_studio/protocol.py db_studio/simulator.py

      - name: Run virtual-lab unit tests
        run: python -m unittest discover -s tests -v

      - name: Run virtual audio lab
        run: python run_virtual_lab.py --seconds 1.5 --rate 48000 --blocksize 128

      - name: Verify native architecture before compilation
        run: python -m unittest tests/test_native_architecture.py -v

      - name: Configure JUCE native application and core tests
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON

      - name: Build core verification tests
        run: cmake --build build --config Release --target dBStudioCoreTests dBStudioMixTests dBStudioQueueTests dBStudioAuthorizationTests

      - name: Run core verification tests before application compilation
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Compile native application
        run: cmake --build build --config Release --target dBStudio --parallel 2

      - name: Upload native application
        uses: actions/upload-artifact@v4
        with:
          name: dB-Studio-0.5.0-Native-Windows
          path: build/dBStudio_artefacts/Release/
          if-no-files-found: error
          retention-days: 30

