name: dB Studio Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Python x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: "x64"
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1
      - name: Executar testes
        run: python -m unittest discover -s tests -v
      - name: Compilar executável
        run: pyinstaller --noconfirm --clean --onedir --name "dB Studio Virtual Lab" run_virtual_lab.py
      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: dB-Studio-Windows-Virtual-Lab
          path: dist/dB Studio Virtual Lab/
          if-no-files-found: error
          retention-days: 14
