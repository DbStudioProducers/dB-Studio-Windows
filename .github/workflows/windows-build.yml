name: dB Studio Native Windows Build
concurrency:
  group: dB-Studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
on:
  push:
    branches: [main, "feature/**", "poc/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  native-build:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prepare Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.10"
          architecture: "x64"
      - name: Install virtual-lab dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile run_virtual_lab.py db_studio/__init__.py db_studio/mixer.py db_studio/protocol.py db_studio/simulator.py tests/test_core.py tests/test_native_architecture.py
      - name: Verify native architecture before compilation
        run: python -m unittest tests/test_native_architecture.py -v
      - name: Run virtual-lab unit tests
        run: python -m unittest tests/test_core.py -v
      - name: Run virtual audio lab
        run: python run_virtual_lab.py --seconds 1.5 --rate 48000 --blocksize 128
      - name: Configure JUCE native application and core tests
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON
      - name: Build core verification tests
        run: cmake --build build --config Release --target dBStudioCoreTests dBStudioMixTests dBStudioQueueTests dBStudioAuthorizationTests dBStudioPacketTests dBStudioIemPacketPumpTests dBStudioTransportSecurityTests
      - name: Run core verification tests before application compilation
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Compile native application
        run: cmake --build build --config Release --target dBStudio --parallel 2
      - name: Generate SHA-256 manifest
        shell: pwsh
        run: |
          $root = (Resolve-Path "build/dBStudio_artefacts/Release").Path
          $files = @(Get-ChildItem -LiteralPath $root -File -Recurse | Sort-Object FullName)
          if ($files.Count -eq 0) { throw "No native application files found for hashing" }
          $lines = foreach ($file in $files) {
            $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName
            $relative = $file.FullName.Substring($root.Length).TrimStart([IO.Path]::DirectorySeparatorChar, [IO.Path]::AltDirectorySeparatorChar)
            "$($hash.Hash.ToLowerInvariant())  $relative"
          }
          $manifest = Join-Path $root "SHA256SUMS.txt"
          [IO.File]::WriteAllLines($manifest, [string[]]$lines, [System.Text.UTF8Encoding]::new($false))
      - name: Upload native application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dB-Studio-0.5.0-Native-Windows
          path: build/dBStudio_artefacts/Release/
          if-no-files-found: error
          retention-days: 30

